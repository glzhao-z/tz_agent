# 该示例仅包含五个服务与依赖关系

services: # 定义所有容器服务
  postgres:
    image: pgvector/pgvector:pg16
    container_name: allagent-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
# 这是个数据库保存用户历史信息的，不可以暴露端口到宿主机的
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s      # 每10秒检查一次
      timeout: 5s        # 检查超时时间
      retries: 5         # 连续失败5次视为不健康

  redis:  # Redis缓存服务（服务名称自定义）
    image: redis:6
    container_name: allagent-redis
    command: redis-server --appendonly yes --requirepass redis123  # 启动命令：启用AOF持久化并设置访问密码
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - allagent-network

# 数据卷定义：用于持久化存储数据
volumes:
  postgres_data:    # PostgreSQL 数据库数据持久化
  redis_data:       # Redis 缓存数据持久化
  minio_data:       # MinIO 对象存储数据持久化
  agent_files:      # Agent 生成文件持久化存储

# 网络配置：定义容器间的网络通信
networks:
  allagent-network:  # 自定义桥接网络
    driver: bridge   # 使用桥接网络模式